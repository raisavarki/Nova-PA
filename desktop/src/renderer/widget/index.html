<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Nova widget</title>
<style>
  :root { --text: #2F2B26; --muted: #8C8273; --accent: #D9773F; --line: rgba(80,55,25,.12); font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--text); overflow: hidden; }
  .card { position: absolute; inset: 5px; border-radius: 20px; box-shadow: 0 14px 34px rgba(80,55,25,.26), 0 2px 6px rgba(80,55,25,.12), inset 0 0 0 1px rgba(255,255,255,.5); display: flex; flex-direction: column; overflow: hidden; backdrop-filter: saturate(1.1); }
  /* soft top-light gradient on every colour for a premium, layered look */
  .card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 42%); pointer-events: none; }
  .peach { background: linear-gradient(160deg,#FDEEE1,#F7D9C2); } .yellow { background: linear-gradient(160deg,#FFF7CF,#FBEBA6); } .mint { background: linear-gradient(160deg,#E6F6EA,#CDE9D4); } .lavender { background: linear-gradient(160deg,#EFEAFA,#DDD3F1); } .cream { background: linear-gradient(160deg,#FFFEFB,#F4ECDF); } .sky { background: linear-gradient(160deg,#E7F3FB,#CFE6F5); }
  header { -webkit-app-region: drag; display: flex; align-items: center; gap: 6px; padding: 8px 9px 5px 13px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: rgba(60,40,20,.55); position: relative; z-index: 1; }
  header .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  header button { -webkit-app-region: no-drag; border: 0; background: transparent; cursor: pointer; color: rgba(60,40,20,.45); font-size: 12px; padding: 2px 4px; border-radius: 6px; }
  header button:hover { background: rgba(255,255,255,.5); color: var(--text); }
  header button.on { color: var(--accent); }
  main { flex: 1; overflow: auto; padding: 0 13px 11px; position: relative; z-index: 1; }
  textarea { width: 100%; height: 100%; border: 0; background: transparent; resize: none; outline: none; font: inherit; font-size: 14px; line-height: 1.5; color: var(--text); }
  .row { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .chk { width: 16px; height: 16px; border-radius: 5px; border: 1.6px solid #C9B79F; flex: none; cursor: pointer; margin-top: 1px; background: rgba(255,255,255,.6); }
  .chk:hover { border-color: var(--accent); } .chk.on { background: var(--accent); border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 12px; }
  .big { font-family: "Iowan Old Style", Georgia, serif; font-size: 46px; line-height: 1; text-align: center; margin-top: 4px; }
  .center { text-align: center; }
  input.add { width: 100%; border: 0; border-top: 1px dashed var(--line); background: transparent; padding: 6px 0; font: inherit; font-size: 13px; outline: none; }
  .colors { display: flex; gap: 4px; -webkit-app-region: no-drag; opacity: 0; transition: opacity .2s; } header:hover .colors { opacity: 1; }
  .colors span { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,.1); }
  .tm { font-family: "Iowan Old Style", Georgia, serif; font-size: 34px; text-align: center; }
  .clocks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 6px; font-size: 12px; }
  .bar { height: 8px; background: rgba(255,255,255,.6); border-radius: 5px; overflow: hidden; margin: 8px 0; } .bar i { display: block; height: 100%; background: var(--accent); }
  .btn { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; box-shadow: 0 2px 6px rgba(217,119,63,.3); }
  .btn:hover { filter: brightness(1.05); } .btn:active { transform: translateY(1px); }
  .btn.ghost { background: rgba(255,255,255,.6); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .ring-wrap { margin-top: 6px; }
</style></head>
<body><div class="card" id="card"><header><span class="t" id="title"></span><span class="colors" id="colors"></span><button id="pin" title="Keep on top">📌</button><button id="close" title="Remove widget">✕</button></header><main id="main"></main></div>
<script src="widget.js"></script></body></html>
