<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F6F1E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nova">
<meta name="mobile-web-app-capable" content="yes">
<title>Nova</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="avatar.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="bot-wrap"><div id="bot"></div></div>
      <div class="greet"><div id="greetHi">Hi</div><div id="greetSub" class="muted"></div></div>
      <button id="btnSearch" class="icon-btn" title="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></button>
      <button id="btnVoice" class="icon-btn" title="Voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button id="btnTheme" class="icon-btn" title="Theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor" stroke="none"/></svg></button>
    </header>

    <div id="bubble" class="bubble"></div>

    <main id="main"></main>

    <div id="toast" class="m-toast"></div>

    <nav id="tabs">
      <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
      <button data-tab="tasks"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.3 12.2 11 15l4.7-5.2"/></svg>Tasks</button>
      <button data-tab="add" class="fab"><span><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></span></button>
      <button data-tab="reminders"><svg viewBox="0 0 24 24"><path d="M18 16.5v-5a6 6 0 1 0-12 0v5l-1.6 2.2a.5.5 0 0 0 .4.8h14.4a.5.5 0 0 0 .4-.8z"/><path d="M9.7 21a2.4 2.4 0 0 0 4.6 0"/></svg>Remind</button>
      <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>More</button>
    </nav>
  </div>

  <div id="sheet" class="sheet"><div class="sheet-card" id="sheetCard"></div></div>

  <script src="avatar.js"></script>
  <script src="supabase-config.js"></script>
  <script src="nova-account.js"></script>
  <script src="sync-cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
